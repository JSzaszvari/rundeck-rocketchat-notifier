apply plugin: 'java'
sourceCompatibility = 1.8
targetCompatibility = 1.8
project.version = 0.7
defaultTasks 'clean', 'build'

configurations{
    //declare custom pluginLibs configuration to include only libs for this plugin
    pluginLibs

    //declare compile to extend from pluginLibs so it inherits the dependencies
    // 'compile' is deprecated, use 'implementation'
    implementation{
        // extendsFrom pluginLibs // No longer needed for compilation classpath
    }
    // pluginLibs remains for packaging purposes
}

repositories {
    mavenCentral()
    maven {
        url "https://repo1.maven.org/maven2"
    }
}

dependencies {
    pluginLibs group: 'org.freemarker', name: 'freemarker', version: '2.3.20'
    pluginLibs group: 'org.json', name: 'json', version: '20180130'
    // Add all dependencies needed for compilation to 'implementation'
    implementation group: 'org.freemarker', name: 'freemarker', version: '2.3.20'
    implementation group: 'org.json', name: 'json', version: '20180130'
    implementation(group:'org.rundeck', name: 'rundeck-core', version: '2.1.1')
}

// Add JVM arguments to allow reflection access needed by older dependencies on newer Java versions
tasks.withType(JavaCompile) {
    options.fork = true
    options.forkOptions.jvmArgs += '--add-opens=java.base/java.io=ALL-UNNAMED'
}

tasks.withType(Test) {
    jvmArgs += '--add-opens=java.base/java.io=ALL-UNNAMED'
}

// task to copy plugin libs to output/lib dir
task copyToLib(type: Copy) {
    into "$buildDir/output/lib"
    from configurations.pluginLibs
}

jar {
    //include contents of output dir
    from "$buildDir/output"
    manifest {
        attributes 'Rundeck-Plugin-Version': '1.1', 'Rundeck-Plugin-Archive': 'true','Rundeck-Plugin-File-Version': "${project.version}"
        //create space-separated list of pluginLibs
        def libList = configurations.pluginLibs.collect{'lib/'+it.name}.join(' ')
        attributes 'Rundeck-Plugin-Classnames': 'com.jszaszvari.rundeck.plugins.rocketchat.RocketChatNotificationPlugin', 'Rundeck-Plugin-Libs': "${libList}"
    }
}

//set jar task to depend on copyToLib
jar.dependsOn(copyToLib)

